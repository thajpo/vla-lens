[project]
name = "openvla-steering"
version = "0.1.0"
description = "Minimal scaffolding for VLA steering experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3,<2.0",
    "imageio>=2.37,<3.0",
    "imageio-ffmpeg>=0.6,<0.7",
    "matplotlib>=3.10,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=19.0,<20.0",
    "robosuite>=1.5.2,<2.0",
    "scikit-learn>=1.6,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvla_steering"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
