[project]
name = "vla-lens"
version = "0.1.0"
description = "Episode-aligned interpretability tools for VLA robot policies"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1,<2.0",
    "fastapi>=0.136.3,<1.0",
    "hydra-core>=1.3,<2.0",
    "imageio>=2.37,<3.0",
    "imageio-ffmpeg>=0.6,<0.7",
    "matplotlib>=3.10,<4.0",
    "numcodecs>=0.13,<0.16",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=19.0,<25.0",
    "pyyaml>=6.0,<7.0",
    "scikit-learn>=1.6,<2.0",
    "uvicorn>=0.48.0,<1.0",
    "zarr>=2.18,<3.0",
]

[project.scripts]
vla-pi05-capture = "vla_lens.pi05.capture:main"
vla-pi05-batch-capture = "vla_lens.pi05.batch_capture:main"
vla-pi05-intervene = "vla_lens.pi05.intervention_runner:main"
vla-pi05-patch-study = "vla_lens.pi05.patch_study_runner:main"
vla-cache = "vla_lens.cache_cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_lens"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/.venv-*",
    "/artifacts",
    "/frontend/node_modules",
    "/runs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
filterwarnings = [
    "ignore:y_pred contains classes not in y_true:UserWarning:sklearn\\.metrics\\._classification",
    "ignore:A single label was found in 'y_true' and 'y_pred'.*:UserWarning:sklearn\\.metrics\\._classification",
    "ignore:Stochastic Optimizer.*:sklearn.exceptions.ConvergenceWarning:sklearn\\.neural_network\\._multilayer_perceptron",
]
norecursedirs = [
    ".git",
    ".venv",
    "artifacts",
    "runs",
]
