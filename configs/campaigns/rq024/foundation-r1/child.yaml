      evidence_artifact_type: gate_analysis
    - id: confirmation_eligible_count
      role: positive
      value_id: confirmation_eligible_count
      operator: greater_than_or_equal
      threshold: 6
      unit: task_object_families
      evidence_artifact_type: gate_analysis
    - id: discovery_total_count
