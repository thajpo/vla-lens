      value_id: discovery_total_count
      operator: equal
      threshold: 12
      unit: task_object_families
      evidence_artifact_type: gate_analysis
    - id: confirmation_total_count
      role: integrity
      value_id: confirmation_total_count
      operator: equal
      threshold: 12
      unit: task_object_families
      evidence_artifact_type: gate_analysis
    - id: trial_matrix_complete
