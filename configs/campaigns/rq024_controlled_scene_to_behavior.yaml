      write_namespace: geometry_internal_discovery
      selection_allowed: true
      exposure_class: mechanistic_internal
    entry_gate: The geometry confirmation result and exact model-action-space target are frozen.
    actions:
      - Cross scene A or B with recipient, donor, and midpoint current action guesses at identical times.
      - Quantify scene, action-state, and interaction effects on the normalized 50-by-7 velocity update.
      - Search only prefix key/value sites consumed by the action expert and therefore patchable by the causal child.
      - Use nested leave-one-family-out selection and repeat the full search under scene shuffling.
      - Report pixels and generic vision as information and specificity comparisons, not disqualifiers.
    primary_claim:
      metric_id: fixed_x_scene_velocity_delta_r2_over_null
      definition: >-
        Nested held-out explained variance for predicting the full model's paired
        normalized 50-by-7 scene-induced velocity delta at identical t and x_t,
        minus the locked full-pipeline scene-shuffle null.
      unit: explained_variance_points
      direction: larger_positive_margin
    independent_unit: task_object_family
    controls:
      - same scene crossed with recipient, donor, and midpoint x_t
      - irrelevant-object scene change
      - metadata and within-task scene-shuffle selection nulls
      - pixels and fixed generic vision reported separately
    child_contract:
      additional_lock_fields:
        - exact_geometry_confirmation_result_hash
        - normalized_velocity_schedule_formula_shape_and_unit
        - patchable_prefix_key_value_candidate_universe
        - nested_family_selection_and_evaluation_splits
        - fixed_t_x_t_paths_and_interpolation_rule
        - scene_action_state_main_effect_and_interaction_formulas
        - maximum_two_selected_sites
    required_outputs:
      - geometry_fixed_x_trial_manifest.parquet
      - paired_scene_action_state_outputs
      - full_candidate_and_null_tables
      - geometry_selected_site_lock.json
      - geometry_internal_audit.json
      - geometry_internal_claim.json
    advance_gate: >-
      At most two patchable sites exceed the locked selection-null and metadata
      margins on nested held-out discovery families, while the scene effect is
      distinguishable from action-state and interaction effects.
    stop_rules:
      - Stop if the scene effect disappears when x_t is fixed.
      - Stop if only action-state or interaction effects explain the result.
      - Do not require the VLA site to beat pixels or generic vision to establish decodability.
    outcome_actions:
      positive: reevaluate_program
      negative: reevaluate_program
      inconclusive: stop_branch
      not_applicable: reevaluate_program
      invalid: revise_child
    allowed_conclusions:
