      write_namespace: binding_causal_confirmation
      selection_allowed: false
      exposure_class: causal_patch
    entry_gate: >-
      The phase-two lock is closed with every activated causal and semantic
      confirmation child committed before any phase-two internal output is opened.
    actions:
      - Run the exact frozen binding site, directions, doses, and controls.
      - Make no layer, token, head, time, dose, metric, or subgroup selection.
      - Supersede binding causal discovery if the unchanged gate fails.
    primary_claim:
      metric_id: binding_local_velocity_transfer_fraction_over_control
      definition: Exact frozen definition from BINDING-CAUSAL-DISCOVERY.
      unit: dimensionless_transfer_fraction
      direction: larger_positive_margin_in_both_directions
    independent_unit: task_object_family
    controls:
      - exact frozen binding causal-discovery controls
      - phase-two first-access and prospective exposure log
      - frozen method, site, and analysis hashes
    child_contract:
      additional_lock_fields:
        - prospective_cohort_hash
        - exact_binding_causal_discovery_result_and_method_hashes
        - phase_two_lock_receipt_hash
    required_outputs:
      - binding_causal_confirmation_trials.parquet
      - binding_causal_confirmation_analysis.json
      - binding_causal_confirmation_audit.json
      - binding_causal_confirmation_claim.json
