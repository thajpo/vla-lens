  - id: GEOMETRY-CAUSAL-DISCOVERY
    title: Geometry prefix-path causal discovery
    kind: causal_discovery
    phase: mechanism_discovery
    source_claim_study: GEOMETRY-INTERNAL-DISCOVERY
    question: Does the selected geometry prefix path cause the local fixed-x velocity correction?
    entry_conditions:
      requires_all_completed:
        - GEOMETRY-INTERNAL-DISCOVERY
      requires_any_positive:
        - GEOMETRY-INTERNAL-DISCOVERY
      branch_mode: single
      source_priority: []
    data_scope:
      family_pool: discovery
      pool_phase: mechanism_discovery
      requires_gate: behavior_results_sealed
      read_namespaces:
        - geometry_internal_discovery
        - discovery_prefix_key_values
      write_namespace: geometry_causal_discovery
      selection_allowed: true
      exposure_class: causal_patch
    entry_gate: At most two geometry sites, exact x_t values, and the velocity metric are locked.
    actions:
      - Patch the selected prefix keys/values consumed by the action expert at fixed x_t.
      - Run both scene directions, signed doses, key-only, value-only, and joint patches.
      - Compare self, zero, shuffled, wrong-factor, unrelated-donor, and covariance-matched controls.
      - Separate one-step local velocity transfer from propagated final-action transfer.
    primary_claim:
      metric_id: geometry_local_velocity_transfer_fraction_over_control
      definition: >-
        dot(v_patch minus v_recipient, v_donor minus v_recipient) divided by the
        squared norm of v_donor minus v_recipient, minus the strongest locked
        control, using normalized 50-by-7 velocity at the identical t and x_t.
      unit: dimensionless_transfer_fraction
      direction: larger_positive_margin_in_both_directions
    independent_unit: task_object_family
    controls:
      - self, zero, shuffled-site, wrong-factor, and unrelated natural donors
      - covariance-matched natural-difference control
      - signed dose and reverse direction
      - unrelated action-dimension noninferiority margin
    child_contract:
      additional_lock_fields:
        - exact_geometry_internal_result_and_site_hashes
        - exact_key_value_head_token_layer_time_and_position_scope
        - normalized_local_velocity_transfer_formula
        - control_construction_effect_and_noninferiority_margins
    required_outputs:
      - geometry_causal_discovery_trials.parquet
      - local_velocity_and_propagated_action_arrays
      - geometry_causal_discovery_analysis.json
      - geometry_causal_discovery_audit.json
      - geometry_causal_discovery_claim.json
    advance_gate: >-
      Local transfer exceeds the strongest control by the locked margin in both
      directions and preserves unrelated dimensions. Propagated-action evidence
      is reported separately and cannot rescue a failed local gate.
    stop_rules:
      - Stop on replay, hook-count, alignment, or fixed-x failure.
      - Stop if wrong-factor or generic patch controls match the intended patch.
      - Do not call a local velocity effect a physical behavior mechanism.
    outcome_actions:
      positive: reevaluate_program
      negative: reevaluate_program
      inconclusive: stop_branch
      not_applicable: reevaluate_program
      invalid: revise_child
    allowed_conclusions:
      - Exploratory local causal contribution of the exact geometry prefix path.
    forbidden_conclusions:
      - Confirmed mechanism or closed-loop physical consequence.
    budget:
      max_instances: 1
      max_model_calls: 1000
      max_action_generations: 1000
      max_full_rollouts: 0
      max_simulator_steps: 0
      max_additional_persistent_gb: 5
      max_ephemeral_gb: 40
    required_audits:
      - replay, hook, alignment, bidirectionality, and exact control construction
      - local versus propagated claim separation and discovery-only exposure

