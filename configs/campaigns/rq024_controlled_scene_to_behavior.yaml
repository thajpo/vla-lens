  - id: RELIABILITY-DESIGN
    title: Decide whether failures support a separate reliability program
    kind: reliability_design
    phase: discovery
    question: Is there enough natural failure data for an independent failure-prediction study?
    entry_conditions:
      requires_all_completed:
        - FOUNDATION
      requires_any_positive: []
      branch_mode: single
      source_priority: []
    data_scope:
      family_pool: both_baseline_only
      pool_phase: baseline
      requires_gate: none
      read_namespaces:
        - foundation_baseline
      write_namespace: reliability_design
      selection_allowed: false
      exposure_class: reliability_design
    entry_gate: Untouched failures are preserved with exact task and scene identities.
    actions:
      - Count natural failures separately from mutation-induced failures.
      - Audit whether task, scene, and outcome strata can support nested family-level selection.
      - Estimate the cohort required for calibration and prospective reliability confirmation.
      - Create a separate research program only if the data and decision are worthwhile.
    primary_claim:
      metric_id: eligible_natural_failure_family_count
      definition: Number of task-object families with both natural failures and successes under one distribution.
      unit: task_object_families
      direction: sufficient_for_a_separate_powered_design
    independent_unit: task_object_family
    controls:
      - natural and mutation-induced failures remain separate strata
      - no feature search on a future reliability confirmation set
      - metadata and output-variability baselines are specified before any internal probe
    child_contract:
      additional_lock_fields:
        - failure_taxonomy_and_distribution
        - power_and_calibration_target
        - dedicated_discovery_and_confirmation_plan
    required_outputs:
      - failure_cohort_audit.json
      - reliability_program_decision.json
    advance_gate: A separate adequately supported reliability program can be specified without mixing failure distributions.
    stop_rules:
      - Do not train up to hundreds of readouts on the small RQ-024 scene cohort.
      - Do not equate failure prediction with causal explanation.
    outcome_actions:
      positive: create_separate_program
      negative: reevaluate_program
      inconclusive: stop_branch
      not_applicable: reevaluate_program
      invalid: revise_child
    allowed_conclusions:
      - The available failures can or cannot support a separate reliability design.
    forbidden_conclusions:
      - Any failure predictor or cause has been established.
    budget:
      max_instances: 1
      max_model_calls: 0
      max_action_generations: 0
      max_full_rollouts: 0
      max_simulator_steps: 0
      max_additional_persistent_gb: 0
      max_ephemeral_gb: 1
    required_audits:
      - failure distributions, independent units, and prospective split feasibility

program_budget:
  max_persistent_gb: 100
  max_ephemeral_gb: 150
  min_free_space_gb: 200
  max_full_rollouts: 500
  max_action_generations: 18000
  max_model_calls: 18000
  max_simulator_steps: 250000
  max_concurrent_hardware_children: 1
  check_before_every_hardware_child: true

authority:
  automatic:
    - Read-only data, prior-artifact, feasibility, and schema checks.
    - Focused normal-environment tooling and tests required by the next child study.
    - Preparing a child job manifest and requesting an independent agent audit.
    - Executing a content-hashed, committed, independently audited child job inside its budget.
    - Resuming unchanged jobs, recomputing results, and stopping on declared gates.
  requires_human:
    - A new scientific question or materially different model, environment, or population.
    - A larger compute, rollout, or storage budget.
    - External paid compute, publication, or destructive source-capture removal.
    - Changing a locked primary metric, cohort, threshold, control, site, or confirmation rule.

program_stop_rules:
  - Never relax competence, control, budget, or confirmation gates after seeing results.
  - Do not localize internals until a controlled physical behavior effect survives a rollout check.
  - Behavioral confirmation proceeds independently of success or failure in internal localization.
  - Any unresolved audit error blocks execution or claim promotion.
  - A confirmation failure supersedes its exploratory positive without erasing either artifact.
  - Negative, invalid, failed, and superseded studies remain visible.
