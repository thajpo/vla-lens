schema_version: 1
kind: autonomous_research_program
program_id: rq024-controlled-scene-to-behavior
title: Controlled scene, instruction, and robot-state use in PI0.5
revision: 1
control_issue: https://github.com/thajpo/vla-lens/issues/37
question: >-
  Does PI0.5 combine the scene, instruction, and robot state into appropriate,
  reusable behavior, or does it mainly rely on familiar layouts and generic
  visual sensitivity?
decision_unlocked: >-
  Decide whether to pursue a factor-specific internal mechanism, treat PI0.5
  primarily as a shortcut or reliability-analysis target, or stop because the
  policy lacks the behavior required for this mechanistic question.
research_question_ids:
  - RQ-021
  - RQ-023
  - RQ-024

protocol_defaults:
  version: 1
  documentation: docs/autonomous-research-campaigns.md

decision_protocol:
  completion_outcomes:
    - positive
    - negative
    - inconclusive
    - not_applicable
  entry_rule: >-
    A study becomes eligible only when every requires_all_completed study has a
    valid terminal result and, when present, at least one requires_any_positive
    study has a positive audited result. Invalid studies must be revised; they
    never satisfy an entry condition.
  branch_rule: >-
    Geometry and binding have separate named nodes from behavior discovery
    through rollout. Every source-bound child names exactly one predecessor.
    When both sources are positive, both branches activate independently; an
    agent may not merge them or choose only the easier-looking branch.

execution_gates:
  discovery_sealed:
    all_terminal:
      - GEOMETRY-DISCOVERY
      - BINDING-DISCOVERY
      - SEMANTIC-DISCOVERY
    lock_before_next_pool_access:
      - child_study_id: GEOMETRY-CONFIRMATION
        source_study_id: GEOMETRY-DISCOVERY
        source_outcome: positive
      - child_study_id: BINDING-CONFIRMATION
        source_study_id: BINDING-DISCOVERY
        source_outcome: positive
    rule: >-
      Geometry and binding discovery run independently. Semantic discovery uses
      discovery families only. Before the first behavior-confirmation trial,
      every confirmation child activated by a positive behavior discovery result
      is committed and has a passing independent design audit.
  behavior_results_sealed:
    all_activated_terminal:
      - GEOMETRY-CONFIRMATION
      - BINDING-CONFIRMATION
    rule: >-
      A behavior branch activates its matching internal branch only after a
      confirmed positive. The other behavior branch never selects or closes it.
  phase_two_locked:
    all_activated_discovery_terminal:
      - GEOMETRY-CAUSAL-DISCOVERY
      - BINDING-CAUSAL-DISCOVERY
    lock_before_next_pool_access:
      - child_study_id: SEMANTIC-CONFIRMATION
        source_study_id: SEMANTIC-DISCOVERY
        source_outcome: positive
      - child_study_id: GEOMETRY-CAUSAL-CONFIRMATION
        source_study_id: GEOMETRY-CAUSAL-DISCOVERY
        source_outcome: positive
      - child_study_id: BINDING-CAUSAL-CONFIRMATION
        source_study_id: BINDING-CAUSAL-DISCOVERY
        source_outcome: positive
    rule: >-
      All activated semantic and causal confirmation jobs are committed and
      independently audited before any confirmation-family activation, key/value,
      readout, or patch output is produced or inspected.
  program_terminal:
    rule: >-
      No activated study is runnable or active, every activated branch has a
      terminal audited result, and no unresolved audit error or unhandled event remains.

synthesis_rules:
  - id: behavior_and_identity
    when: At least one behavior confirmation and semantic confirmation are positive.
    interpretation: Controlled behavior and identity decodability both survived prospective tests.
  - id: behavior_without_detected_identity_readout
    when: A behavior confirmation is positive and semantic confirmation is negative.
    interpretation: Behavior is reusable, but the tested identity readout did not survive its controls.
  - id: readable_but_behavior_not_confirmed
    when: Semantic confirmation is positive and both behavior confirmations are nonpositive.
    interpretation: This is the H5 readable-but-unused pattern for the tested behaviors, not proof of no use elsewhere.
  - id: fixed_x_effect_disappears
    when: A behavior confirmation is positive and its matching internal discovery is negative.
    interpretation: The older late-state effect is consistent with H4 action-path dependence.
  - id: source_specific_causal_path
    when: One source's causal confirmation is positive.
    interpretation: Only that exact source and path gain a confirmed local causal claim.

scope:
  model:
    family: pi05
    checkpoint_name: lerobot/pi05_libero_finetuned
    checkpoint_revision_rule: Resolve and hash the exact revision in every child contract.
  environment:
    benchmark: libero_90
    simulator_rule: Lock LIBERO, robosuite, MuJoCo, task, camera, and controller versions.
    execution_rule: Use only the dedicated PI0.5 hardware environment and wrappers.
  prior_evidence:
    - RQ-015 found exploratory identity information when the simulator region was supplied.
    - RQ-019 found a reproducible open-loop action difference in five layouts of one task.
    - RQ-020 established broad visual dependence but no object-specific location.
    - RQ-022 replaced whole late action states but confounded scene and action-path effects.
  freshness: >-
    Existing broad-1000 tasks and test data have been inspected and are discovery
    data. Confirmation in this program means prospectively held out from RQ-024
    counterfactual selection, using new scene instances and an exposure log. It
    must not be described as globally untouched unless a prior-artifact audit
    proves that stronger statement.

hypotheses:
  - id: H1-relational-control
    statement: >-
      PI0.5 binds the instructed object to current scene and robot geometry and
      computes a reusable target-relative control response.
    distinguishing_predictions:
      - Target displacement produces a matching physical trajectory correction.
      - Changing the named target routes behavior while pixels remain fixed.
      - The relationship repeats across task-object families, layouts, and robot starts.
      - A narrow internal path can transfer the relevant correction selectively.
  - id: H2-layout-shortcut
    statement: >-
      Task and layout patterns explain behavior better than an episode-specific
      scene relationship.
    distinguishing_predictions:
      - Discovery effects fail on prospectively held-out task-object families.
      - Task, layout, prompt, or prior-action predictors rival model internals.
      - Within-task shuffled scene signals retain most apparent predictive power.
  - id: H3-generic-visual-sensitivity
    statement: >-
      Scene changes perturb the output without a task-specific physical response.
    distinguishing_predictions:
      - Irrelevant-object changes rival target changes after image salience is matched.
      - Action deltas do not point toward the required target-relative correction.
      - Intended internal patches do not beat natural wrong-factor controls.
  - id: H4-denoising-path-dependence
    statement: >-
      Late expert differences mostly reflect action guesses that have already
      diverged, not a progressively stronger scene signal.
    distinguishing_predictions:
      - The action-state main effect is large when scene and current action guess are crossed.
      - Late scene effects shrink or change meaning when the current action guess is fixed.
      - Whole late-state replacement remains strong while a narrow scene path does not.
  - id: H5-readable-but-unused
    statement: >-
      Object information is readable under controlled variation but is not used
      for the tested behavior, or becomes relevant only under another instruction.
    distinguishing_predictions:
      - Identity decoding survives layout and pose changes without a matching behavior effect.
      - Instruction changes reveal behavioral use absent under a fixed instruction.
      - Intervening on the readable signal does not selectively change relevant behavior.

population:
  primary_independent_unit: task_object_family
  nested_units:
    - scene layout within task-object family
    - matched flow-noise sample within scene condition
    - policy call, action position, token, head, layer, and denoising time within trial
  candidate_pool:
    max_families: 24
    canonical_family_id: >-
      libero_90 task ID, normalized task verb, normalized instructed object,
      normalized destination or secondary object, joined with ASCII unit separators.
    rank_digest: >-
      sha256 of rq024-family-rank-v1, a null byte, program_id, a null byte, and
      canonical_family_id encoded as UTF-8. Break digest ties by canonical_family_id.
    stratum: normalized task verb and normalized instructed-object identity
    interleave_rule: >-
      Sort strata by sha256 of rq024-stratum-v1 plus the stratum ID. Sort families
      within each stratum by rank_digest. Repeatedly take one family from each
      nonempty stratum in that fixed order until 24 are selected.
    selection_rule: >-
      Before rollout outcomes are known, enumerate every LIBERO-90 task, parse it
      with a versioned family parser, preserve every rejection and reason, then
      apply the exact interleave and rank rules above. Commit the task-catalog,
      parser, source-universe, candidate-table, and rejection-table hashes.
  pool_assignment:
    discovery_candidates: 12
    confirmation_candidates: 12
    assignment_rule: >-
      Assign even zero-based candidate positions to discovery and odd positions
      to confirmation until each has twelve families. This assignment is locked
      before baseline screening. Do not move a family after seeing success or
      any counterfactual result.
  baseline_screen:
    untouched_rollouts_per_family: 3
    eligibility_rule: at_least_2_of_3_successes
    interpretation: Operational screen only, not a precise policy-success estimate.
    permitted_confirmation_exposure: >-
      Baseline competence may be inspected in both pools. Counterfactual actions,
      internal sites, and intervention outcomes in the confirmation pool may not.
  required_eligible:
    discovery: 6
    confirmation: 6
    failure_rule: >-
      If either preassigned pool has fewer than six eligible families, stop the
      general mechanism program. Do not refill one pool from the other.
  cohort_selection:
    base_rule: >-
      Within each pool, select the first six baseline-eligible families in the
      precomputed outcome-blind order. Preserve every other eligible family as
      nonselected evidence; never substitute it after counterfactual results.
    child_structural_rule: >-
      If a child needs additional structural support, apply its predeclared
      outcome-blind structural filter to the same ordered pool and select the
      first six passing families before any child model output is generated.
      If fewer than six pass, that child is not applicable; do not backfill it
      after inspecting another child's result.
  identity_support:
    vocabulary_rule: >-
      Lock identity labels before the semantic readout. Each claim-bearing label
      must occur in at least three distinct selected discovery families, and at
      least three labels must pass. Unsupported labels remain listed but cannot
      count as decoding failures. This program makes no zero-shot identity claim.
  pool_exposure:
    discovery: >-
      Geometry and binding discovery, semantic readout, internal selection, and
      causal discovery use only discovery families.
    confirmation: >-
      Before a causal-confirmation child is locked, agents may inspect baseline
      and frozen behavior-confirmation outputs only. They may not compute or
      inspect confirmation-family activations, token or layer scores, fixed-x
      outputs, keys/values, patches, or semantic readouts. The first-access log
      records exposure type, study, agent, artifact hash, and time.
  discovery_design:
    families: 6
    new_layouts_per_family: 4
    matched_flow_noise_per_cell: 4
  confirmation_design:
    families: 6
    new_layouts_per_family: 4
    matched_flow_noise_per_cell: 4
  deterministic_seed_rule: >-
    Derive layout, reset, environment, policy, and flow-noise seeds in separate
    domains from sha256(program_id, child_plan_id, canonical_family_id, cell_id,
    replicate_id, seed_domain). The child trial manifest stores the resolved
    integer seeds before execution; one seed may not silently stand in for another.
  inference_rule: >-
    Weight task-object families equally and resample hierarchically by family,
    then layout. Report n_families, n_layouts, n_noise, and n_rollouts. Noise,
    action elements, tokens, and denoising steps never increase independent n.

child_contract_defaults:
  required_lock_fields:
    - question_and_allowed_claim
    - exact_model_checkpoint_hash
    - environment_camera_controller_and_preprocessor_versions
    - cohort_split_and_prior_exposure_hashes
    - metric_id_and_formula
    - minimum_useful_effect
    - controls
    - trial_matrix_and_seed_schedule
    - analysis_code_commit
    - runner_config_hash
    - output_root_and_storage_budget
    - stop_and_transition_rules
    - precision_or_bounded_replication_justification
    - small_sample_family_level_inference
  required_evidence:
    - immutable child plan and fingerprint
    - exact job and trial manifest with expected count
    - preflight, command, environment, code, model, dataset, and seed identities
    - append-only attempts, failures, exclusions, and deviations
    - full physical action or behavior outputs needed to recompute metrics
    - strongest controls and all candidate-selection results
    - independent schema, execution, calculation, and claim audits
    - machine result card and generated human summary
  lock_rule: >-
    A child study cannot execute model or simulator trials until its exact job
    manifest is content-hashed, committed, and independently audited. Any change
    to a claim-bearing field creates a new child revision.

studies:
  - id: FOUNDATION
    title: Task support and untouched behavior screen
    kind: preparation
    phase: foundation
    question: Which task-object families support the design and competent base behavior?
    entry_conditions:
      requires_all_completed: []
      requires_any_positive: []
      branch_mode: single
      source_priority: []
    data_scope:
      family_pool: both_baseline_only
      pool_phase: baseline
      requires_gate: none
      read_namespaces:
        - task_catalog
      write_namespace: foundation_baseline
      selection_allowed: true
      exposure_class: baseline_behavior
    entry_gate: Program schema is valid and no model execution has begun.
    actions:
      - Build the outcome-blind 24-family candidate and rejection manifest.
      - Preassign twelve discovery and twelve confirmation candidates.
      - Run three untouched full rollouts per family using locked reset and rollout seeds.
      - Record simulator success, end-effector and object trajectories, object motion, and per-axis action variation.
      - Audit simulator contact telemetry separately; never rename an end-effector distance proxy as contact or collision.
      - Select the first six eligible families in each precomputed pool order.
      - Preserve later eligible families without using them as outcome-driven replacements.
      - Create eligible discovery and confirmation manifests without cross-pool replacement.
      - Lock the family-level precision or bounded-replication interpretation for n equals six.
    primary_claim:
      metric_id: family_baseline_eligibility
      definition: A family is eligible when at least two of three untouched rollouts succeed.
      unit: binary_per_task_object_family
      direction: eligible_in_both_preassigned_pools
    independent_unit: task_object_family
    controls:
      - deterministic outcome-blind candidate ordering
      - environment reset and seed identity
      - simulator success versus contact and object-motion consistency
      - controller action-unit and postprocessing audit
      - prior-research exposure manifest
    child_contract:
      additional_lock_fields:
        - candidate_task_manifest_and_rejection_rules
        - preassigned_pool_membership
        - exact_rollout_reset_seeds
        - maximum_72_rollouts
        - deterministic_first_six_eligible_rule
        - family_level_precision_and_small_sample_method
        - simulator_contact_telemetry_capability_status
    required_outputs:
      - candidate_and_rejection_manifest.parquet
      - pool_assignment.json
      - baseline_rollout_trials.parquet
      - eligible_family_manifests.json
      - physical_trajectories
      - measurement_capability_audit.json
      - foundation_audit.json
    advance_gate: Each preassigned pool contains at least six eligible families.
    stop_rules:
      - Stop the mechanism program if either pool has fewer than six eligible families.
      - Preserve failed families for a separate reliability-design decision.
      - Do not reinterpret baseline screening as counterfactual confirmation.
    outcome_actions:
      positive: reevaluate_program
      negative: reevaluate_program
      inconclusive: stop_branch
      not_applicable: stop_branch
      invalid: revise_child
    allowed_conclusions:
      - The named families do or do not support later controlled comparisons.
    forbidden_conclusions:
      - Baseline success demonstrates a semantic representation.
    budget:
      max_instances: 1
      max_model_calls: 1440
      max_action_generations: 1440
      max_full_rollouts: 72
      max_simulator_steps: 43200
      max_additional_persistent_gb: 10
      max_ephemeral_gb: 20
    required_audits:
      - candidate selection and pool assignment predate outcomes
      - expected versus observed 72-rollout matrix
      - physical units, controller path, failures, and exclusions

  - id: GEOMETRY-DISCOVERY
    title: Target-displacement behavior discovery
    kind: behavior_discovery
    phase: discovery
    question: Does moving the target cause the appropriate target-relative physical correction?
    entry_conditions:
      requires_all_completed:
        - FOUNDATION
      requires_any_positive:
        - FOUNDATION
      branch_mode: single
      source_priority: []
    data_scope:
      family_pool: discovery
      pool_phase: discovery
      requires_gate: none
      read_namespaces:
        - foundation_baseline
        - discovery_scene_state
      write_namespace: geometry_discovery
      selection_allowed: true
      exposure_class: counterfactual_behavior
    entry_gate: Six eligible discovery families and a locked geometry child contract exist.
    actions:
      - Move only the target by zero, plus or minus x, and plus or minus y in table coordinates.
      - Use 0.01 meter displacement; test 0.02 meter only as a predeclared dose check.
      - Keep instruction, robot, camera, distractors, reset state, and matched noise fixed.
      - Simulate action chunks through the actual postprocessor and controller.
      - Run controlled rollouts on a predeclared subset before any internal localization.
      - Report camera and appearance changes separately as robustness stresses, not harmless controls.
    primary_claim:
      metric_id: geometry_response_gain
      definition: >-
        dot(eef_endpoint_mutated minus eef_endpoint_original, target_xy_displacement)
        divided by squared target_xy_displacement, at the prelocked physical horizon.
      unit: dimensionless_gain
      direction: larger_positive_gain
    independent_unit: task_object_family
    controls:
      - zero mutation replay
      - same-scene sampling variation under matched noise schedule
      - irrelevant-object move chosen from task semantics before policy execution
      - task, layout, robot-state, and previous-action predictors
    child_contract:
      additional_lock_fields:
        - target_displacement_frame_axis_and_validity_range
        - physical_horizon_and_task_phase
        - controller_or_oracle_derived_minimum_gain
        - irrelevant_object_selection_and_image_salience_match
        - controlled_rollout_subset_and_contact_endpoint
    required_outputs:
      - geometry_trial_manifest.parquet
      - simulator_state_diff_and_validity.json
      - controller_level_trajectories
      - geometry_discovery_analysis.json
      - geometry_discovery_audit.json
      - geometry_discovery_claim.json
    advance_gate: >-
      The family-weighted gain exceeds the externally calibrated useful margin,
      its hierarchical interval is above zero, it exceeds the irrelevant-object
      control by a locked margin, and the controlled-rollout endpoint changes in
      the expected direction without a material collision increase.
    stop_rules:
      - Stop if controller reconstruction or one-factor simulator validity fails.
      - Stop mechanistic follow-up if only normalized action L2 changes.
      - Treat camera and appearance sensitivity as robustness evidence, not automatic failure.
    outcome_actions:
      positive: reevaluate_program
      negative: reevaluate_program
      inconclusive: stop_branch
      not_applicable: reevaluate_program
      invalid: revise_child
    allowed_conclusions:
      - Exploratory physical target-relative response on the discovery families.
    forbidden_conclusions:
      - General object-position representation or confirmed behavior.
    budget:
      max_instances: 1
      max_model_calls: 1200
      max_action_generations: 1200
      max_full_rollouts: 36
      max_simulator_steps: 21600
      max_additional_persistent_gb: 10
      max_ephemeral_gb: 30
    required_audits:
      - exact one-factor state diff and trial count
      - hierarchical family then layout analysis
      - metric and minimum effect locked without using policy response magnitude
      - strongest matched control and controlled-rollout consequence

  - id: GEOMETRY-CONFIRMATION
    title: Prospectively held-out target-displacement confirmation
    kind: behavior_confirmation
    phase: behavior_confirmation
    question: Does the frozen geometry response repeat on the confirmation pool?
    entry_conditions:
      requires_all_completed:
        - GEOMETRY-DISCOVERY
      requires_any_positive:
        - GEOMETRY-DISCOVERY
      branch_mode: single
      source_priority: []
    data_scope:
      family_pool: confirmation
      pool_phase: behavior_confirmation
      requires_gate: discovery_sealed
      read_namespaces:
        - foundation_baseline
        - geometry_confirmation_scene_state
      write_namespace: geometry_confirmation
      selection_allowed: false
      exposure_class: counterfactual_behavior
    entry_gate: Geometry discovery is positive and its metric, margin, conditions, and code are frozen.
    actions:
      - Run the frozen geometry job on six preassigned confirmation families and new scene instances.
      - Make no layer, metric, subgroup, condition, or threshold change.
      - Supersede the discovery claim if this confirmation fails.
    primary_claim:
      metric_id: geometry_response_gain
      definition: Exact frozen definition and horizon from GEOMETRY-DISCOVERY.
      unit: dimensionless_gain
      direction: larger_positive_gain
    independent_unit: task_object_family
    controls:
      - frozen zero, sampling, irrelevant-object, and metadata controls
      - prospective exposure and first-access log
      - discovery and confirmation family and scene disjointness
    child_contract:
      additional_lock_fields:
        - prospective_cohort_hash
        - discovery_claim_and_method_hash
        - metric_id_and_formula
        - minimum_useful_effect
        - controls
        - analysis_code_commit
        - model_checkpoint_hash
        - runner_config_hash
    required_outputs:
      - geometry_confirmation_trials.parquet
      - controller_level_trajectories
      - geometry_confirmation_analysis.json
      - geometry_confirmation_audit.json
      - geometry_confirmation_claim.json
    advance_gate: The unchanged discovery gate passes on the confirmation families.
    stop_rules:
      - Any retuning creates a new discovery study instead of confirmation.
      - Confirmation failure supersedes the exploratory geometry result.
    outcome_actions:
      positive: reevaluate_program
      negative: supersede_source_and_reevaluate
      inconclusive: stop_branch
      not_applicable: reevaluate_program
      invalid: revise_child
    allowed_conclusions:
      - Confirmed geometry response for this checkpoint and declared population.
    forbidden_conclusions:
      - Globally untouched tasks or generality beyond the declared displacement range.
    budget:
      max_instances: 1
      max_model_calls: 1200
      max_action_generations: 1200
      max_full_rollouts: 36
      max_simulator_steps: 21600
      max_additional_persistent_gb: 10
      max_ephemeral_gb: 30
    required_audits:
      - lock commit and plan hash predate confirmation outputs
      - prospective exposure, unchanged method, and no selection
      - claim values recomputed from raw trials

  - id: BINDING-DISCOVERY
    title: Named-target binding behavior discovery
    kind: behavior_discovery
    phase: discovery
    question: Does behavior follow the named object rather than a familiar position?
    entry_conditions:
      requires_all_completed:
        - FOUNDATION
      requires_any_positive:
        - FOUNDATION
      branch_mode: single
      source_priority: []
    data_scope:
      family_pool: discovery
      pool_phase: discovery
      requires_gate: none
      read_namespaces:
        - foundation_baseline
        - discovery_scene_state
      write_namespace: binding_discovery
      selection_allowed: true
      exposure_class: counterfactual_behavior
    entry_gate: Six eligible discovery families support two physically valid named targets.
    actions:
      - Cross two object-position assignments, two valid target instructions, and two robot starts.
      - Keep pixels fixed for instruction comparisons and use four matched noise samples per cell.
      - Treat robot-start changes as whole robot-state changes because the wrist camera also moves.
      - Use target approach or contact rather than task reward when prompt overrides lack valid reward semantics.
      - Run controlled rollouts on one predeclared layout per family before internal localization.
    primary_claim:
      metric_id: named_target_preference_m
      definition: >-
        Minimum distance to the unnamed object minus minimum distance to the
        named object during the prelocked physical time window.
      unit: meters
      direction: larger_positive_preference
    independent_unit: task_object_family
    controls:
      - meaning-preserving instruction paraphrase
      - position assignment with instruction held fixed
      - robot start crossed with both instructions
      - task, layout, prompt-form, and prior-action predictors
    child_contract:
      additional_lock_fields:
        - valid_dual_target_instruction_and_reward_semantics
        - exact_object_assignments_and_robot_start_states
        - physical_time_window_and_contact_definition
        - prompt_token_and_quantized_robot_state_segmentation
        - controlled_rollout_subset
        - first_six_structurally_valid_families_in_precomputed_order
    required_outputs:
      - binding_trial_manifest.parquet
      - instruction_and_simulator_validity.json
      - controller_level_trajectories
      - binding_discovery_analysis.json
      - binding_discovery_audit.json
      - binding_discovery_claim.json
    advance_gate: >-
      The family-weighted named-target preference exceeds the prelocked physical
      margin, repeats across position assignments and robot starts, and produces
      the expected controlled-rollout contact or approach consequence.
    stop_rules:
      - Stop if both instructions are not physically and linguistically valid for a family.
      - Stop mechanistic follow-up if behavior follows position rather than the named target.
      - Do not interpret a prompt-only out-of-distribution failure as absent semantics.
    outcome_actions:
      positive: reevaluate_program
      negative: reevaluate_program
      inconclusive: stop_branch
      not_applicable: reevaluate_program
      invalid: revise_child
    allowed_conclusions:
      - Exploratory named-target binding on the discovery families.
    forbidden_conclusions:
      - Confirmed language grounding or a localized object representation.
    budget:
      max_instances: 1
      max_model_calls: 1728
      max_action_generations: 1728
      max_full_rollouts: 48
      max_simulator_steps: 28800
      max_additional_persistent_gb: 10
      max_ephemeral_gb: 30
    required_audits:
      - instruction validity, task semantics, and complete factorial matrix
      - family-level analysis with noise and layouts nested
      - physical endpoint and controlled-rollout consequence

  - id: BINDING-CONFIRMATION
    title: Prospectively held-out named-target binding confirmation
    kind: behavior_confirmation
    phase: behavior_confirmation
    question: Does the frozen binding relationship repeat on the confirmation pool?
    entry_conditions:
      requires_all_completed:
        - BINDING-DISCOVERY
      requires_any_positive:
        - BINDING-DISCOVERY
      branch_mode: single
      source_priority: []
    data_scope:
      family_pool: confirmation
      pool_phase: behavior_confirmation
      requires_gate: discovery_sealed
      read_namespaces:
        - foundation_baseline
        - binding_confirmation_scene_state
      write_namespace: binding_confirmation
      selection_allowed: false
      exposure_class: counterfactual_behavior
    entry_gate: Binding discovery is positive and its exact comparison is frozen.
    actions:
      - Run the unchanged binding job on six preassigned confirmation families.
      - Preserve the exact prompt, robot-state, object-assignment, metric, and control rules.
      - Supersede the discovery claim if confirmation fails.
    primary_claim:
      metric_id: named_target_preference_m
      definition: Exact frozen definition and time window from BINDING-DISCOVERY.
      unit: meters
      direction: larger_positive_preference
