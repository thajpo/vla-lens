defaults:
  - _self_

env:
  name: stack
  task_mode: two_object_pick
  robot: Panda
  horizon: 200
  control_freq: 20
  use_renderer: false
  use_camera_obs: true
  has_offscreen_renderer: true
  reward_shaping: true
  hard_reset: true
  ignore_done: false
  camera_name: frontview
  camera_height: 224
  camera_width: 224
  camera_depth: false
  target_lift_height: 0.04
  stop_on_first_pick_success: true

run:
  seed: 7
  num_rollouts: 1
  save_video: true
  video_dir: artifacts/videos
  capture_artifacts: true
  capture_dir: artifacts/captures
  video_path: artifacts/videos/stack_pick_debug.mp4
  rollout_log_path: artifacts/logs/stack_rollouts.parquet

model:
  backend: cogact
  scripted_pick:
    target_object: cubeA
    approach_height: 0.10
    grasp_offset: 0.01
    lift_height: 0.18
    position_gain: 8.0
    open_gripper: -1.0
    close_gripper: 1.0
    phase_steps:
      approach: 40
      descend: 35
      close: 25
      lift: 40
  openvla:
    model_id: openvla/openvla-7b
    instruction: "pick up the red block"
    trust_remote_code: true
    device: auto
    torch_dtype: bfloat16
    attn_implementation: null
    unnorm_key: bridge_orig
    action_dim: 7
    camera_name: frontview
  cogact:
    model_id: CogACT/CogACT-Small
    # Instruction format: plain natural language.
    # Switch to "pick up the green cube" for cubeB target.
    instruction: "pick up the red cube"
    action_model_type: DiT-S     # DiT-S=Small, DiT-B=Base, DiT-L=Large
    future_action_window_size: 15  # chunk = future+1 = 16 steps total
    unnorm_key: bridge_orig      # closest match for Panda/OSC_POSE
    cfg_scale: 1.5               # classifier-free guidance scale (1.5-7 all work)
    num_ddim_steps: 10           # DDIM denoising steps
    # Upstream CogACT uses a fresh query each control step plus action ensembling.
    chunk_size: 1
    action_dim: 7
    camera_name: frontview
    device: "cuda:0"             # ROCm uses CUDA-compatible device names
    action_ensemble: true
    action_ensemble_horizon: 7
    adaptive_ensemble_alpha: 0.1
