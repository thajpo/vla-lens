defaults:
  - _self_

env:
  name: stack
  robot: Panda
  horizon: 200
  control_freq: 20
  use_renderer: false
  use_camera_obs: false
  has_offscreen_renderer: true
  reward_shaping: true
  hard_reset: true
  ignore_done: false
  camera_name: frontview

run:
  seed: 7
  steps: 140
  save_video: true
  video_path: artifacts/videos/stack_pick_debug.mp4

policy:
  name: scripted_pick
  target_object: cubeA
  approach_height: 0.10
  grasp_offset: 0.01
  lift_height: 0.18
  position_gain: 8.0
  open_gripper: -1.0
  close_gripper: 1.0
  phase_steps:
    approach: 40
    descend: 35
    close: 25
    lift: 40
