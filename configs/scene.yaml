defaults:
  - _self_

env:
  name: stack
  robot: Panda
  horizon: 200
  control_freq: 20
  use_renderer: false
  use_camera_obs: true
  has_offscreen_renderer: true
  reward_shaping: true
  hard_reset: true
  ignore_done: false
  camera_name: frontview
  camera_height: 224
  camera_width: 224
  camera_depth: false

run:
  seed: 7
  num_rollouts: 1
  save_video: true
  video_dir: artifacts/videos
  video_path: artifacts/videos/stack_pick_debug.mp4
  rollout_log_path: artifacts/logs/stack_rollouts.parquet

model:
  backend: minivla
  scripted_pick:
    target_object: cubeA
    approach_height: 0.10
    grasp_offset: 0.01
    lift_height: 0.18
    position_gain: 8.0
    open_gripper: -1.0
    close_gripper: 1.0
    phase_steps:
      approach: 40
      descend: 35
      close: 25
      lift: 40
  openvla:
    model_id: openvla/openvla-7b
    instruction: pick up the red block
    trust_remote_code: true
    device: auto
    torch_dtype: bfloat16
    attn_implementation: null
    unnorm_key: bridge_orig
    action_dim: 7
    camera_name: frontview
  minivla:
    model_id: Stanford-ILIAD/minivla-vq-libero90-prismatic
    instruction: pick up the red block
    trust_remote_code: true
    device: auto
    torch_dtype: bfloat16
    attn_implementation: null
    unnorm_key: libero_90
    action_dim: 7
    camera_name: frontview
