name: pi05-light-20-smoke
dataset_id: pi05-light-20-smoke
description: >
  Small diverse PI0.5 mechanistic_sampled smoke capture for developing dataset
  coverage/descriptor tooling before the full 500-episode run.

output_root: runs/pi05-light-20-smoke
model_id: lerobot/pi05_libero_finetuned
# Machine-local runtime defaults. Wrapper scripts override these for the chosen backend.
python_executable: .venv-pi05-rocm/bin/python
pythonpath: src
capture_profile: mechanistic_sampled
storage_dtype: float16
obs_size: 256
# ROCm and CUDA both appear as device=cuda to PyTorch.
device: cuda
dtype: bfloat16
start_seed: 1200
seeds_per_task: 2
# Planning estimates used by lint/guardrails; verify disk before real capture.
estimated_mb_per_episode: 220
minimum_free_gb_after_capture: 25

benchmarks:
  - libero_object
  - libero_spatial
  - libero_goal
  - libero_10
  - libero_90

task_ids:
  train_seen_task:
    - 0
  test_heldout_task:
    - 1

seed_splits_for_train_seen_tasks:
  train:
    - 1200
  test_seen_task:
    - 1201

full_calibration:
  enabled: false
  capture_profile: audit_full
  # Keep audit_full disabled unless a narrow site-coverage question requires it.
  episodes: []
