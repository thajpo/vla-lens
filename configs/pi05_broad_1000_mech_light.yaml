name: pi05-broad-1000-mech-light
dataset_id: pi05-broad-1000-mech-light
description: >
  Broad PI0.5/LIBERO mechanistic-light capture. The
  canonical capture profile for mechanistic_light is mechanistic_sampled. This
  run prioritizes task coverage over repeated seeds: all 130 LIBERO task-suite
  pairs are represented, with seven or eight seeds per task for 1000 total
  episodes.
requires_episode_plan: true

output_root: runs/pi05-broad-1000-mech-light
model_id: lerobot/pi05_libero_finetuned
python_executable: .venv-pi05-rocm/bin/python
pythonpath: src
capture_profile: mechanistic_sampled
storage_dtype: float16
obs_size: 256
device: cuda
dtype: bfloat16
estimated_mb_per_episode: 320
minimum_free_gb_after_capture: 25
