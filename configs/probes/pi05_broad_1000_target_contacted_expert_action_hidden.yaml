# Probe training uses saved activations in the normal repo environment, not capture wrappers.
name: PI0.5 broad 1000 target contacted - expert action hidden
question: Has the policy contacted the instructed target object by this episode?
hypothesis_family: object choice before contact / target interaction
intended_claim: target contact state is linearly decodable from expert action hidden states above metadata baselines
target:
  kind: target_contacted
  missing_policy: drop
features:
  module: pi05.expert.layers.*
  tensor_type: hidden_tokens
  token_kind: action
  layers: [0, 4, 8, 12, 17]
  timesteps: all
  policy_calls: [0, 1, 2, 3, 4, 5, 6]
  generation_step: final
  reduction: mean
  dtype: float32
split:
  # Held-out task split is the claim-bearing split; row-level random splits are not enough.
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
  eval_values: [val_heldout_task, test_heldout_task]
baseline:
  - majority_class
  - benchmark
  - task_id
  - scene_family
  - task_verb
  - primary_target_object
  - policy_call_index
probe:
  models: [linear]
sweep: [layer, policy_call_index]
