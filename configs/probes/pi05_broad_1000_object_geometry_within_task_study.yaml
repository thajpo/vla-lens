name: PI0.5 broad 1000 object geometry within-task study
question: Within the same tasks, how well do PI0.5 expert action states encode variation in the instructed object's position and orientation?
hypothesis_family: object-centered scene geometry within task
intended_claim: Exploratory within-task episode generalization of object pose information beyond object, timing, metadata, and pose-persistence baselines.
object_column: primary_target_object
features:
  - id: expert_action_hidden
    module: pi05.expert.layers.*
    tensor_type: hidden_tokens
    token_kind: action
    layers: [0, 4, 8, 12, 17]
    timesteps: all
    policy_calls: all
    generation_step: final
    reduction: mean
    dtype: float32
    sweep: [layer]
split:
  kind: within_task_episode
  group_column: task_id
  seed: 20260718
  column: geometry_split
  train_value: train
  selection_value: val_within_task
  test_value: test_within_task
baseline:
  - benchmark
  - task_id
  - scene_family
  - primary_target_object
  - task_phase
  - policy_call_index
probe:
  pca_dims: [64, 128, 256]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
