name: PI0.5 broad 1000 object motion follow-up study
question: Does PI0.5 contain information about substantial target-object movement beyond task context and the robot's own movement?
hypothesis_family: target-object movement tracking
intended_claim: Exploratory evidence separating visual object-motion information from task, timing, robot-motion, and typical-movement explanations.
object_column: primary_target_object
source_artifact_ids:
  - geometry_probe_study-pi0.5-broad-1000-object-geometry-study-b40227ee15
  - geometry_probe_study-pi0.5-broad-1000-action-head-object-geometry-study-93398f6bdf
  - geometry_probe_study-pi0.5-broad-1000-vlm-object-geometry-study-e156f65fdf
features:
  - id: expert_action_hidden
    module: pi05.expert.layers.*
    tensor_type: hidden_tokens
    token_kind: action
    layers: [0, 4, 8, 12, 17]
    timesteps: all
    policy_calls: all
    generation_step: final
    reduction: mean
    dtype: float32
    sweep: [layer]
  - id: action_head_input
    name: pi05.action_head.input
    tensor_type: action_head
    token_kind: action
    timesteps: all
    policy_calls: all
    generation_step: final
    reduction: mean
    dtype: float32
    sweep: []
  - id: image_prefix_hidden
    name: pi05.vlm.prefix.image_hidden_tokens
    tensor_type: hidden_tokens
    timesteps: all
    policy_calls: all
    reduction: mean
    dtype: float32
    sweep: []
  - id: vlm_prefix_endpoints
    module: pi05.vlm.layers.*
    tensor_type: hidden_tokens
    layers: [0, 17]
    timesteps: all
    policy_calls: all
    reduction: mean
    dtype: float32
    sweep: [layer]
split:
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
baseline:
  - benchmark
  - task_id
  - task_name
  - scene_family
  - primary_target_object
  - task_phase
  - policy_call_index
movement:
  # These physically interpretable ranges are fixed for the saved follow-up.
  # The final held-out tasks were already viewed, so this round remains exploratory.
  position: [0.01, 0.10]
  rotation: [1.0, 15.0]
probe:
  pca_dims: [64, 128, 256]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
