# Probe training uses saved activations in the normal repo environment, not capture wrappers.
name: PI0.5 broad 1000 target contact within 2 calls - expert action hidden
question: Will any instructed target object be contacted within the next two policy calls?
hypothesis_family: temporally local target interaction
intended_claim: near-future target contact is linearly decodable before contact above task/object/timing baselines when policy calls are pooled
target:
  name: target_contact_within_2_policy_calls
  kind: classification
  source: row
  column: target_contact_within_2_policy_calls
  missing_policy: drop
features:
  module: pi05.expert.layers.*
  tensor_type: hidden_tokens
  token_kind: action
  layers: [0, 4, 8, 12, 17]
  timesteps: all
  policy_calls: [0, 1, 2, 3, 4, 5, 6]
  generation_step: final
  reduction: mean
  dtype: float32
split:
  # Held-out task split is the claim-bearing split; validation selects layer/call.
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
  eval_values: [val_heldout_task, test_heldout_task]
row_filter:
  all:
    - column: target_contact_in_future
      op: truthy
baseline:
  - majority_class
  - benchmark
  - task_id
  - scene_family
  - task_verb
  - primary_target_object
  - policy_call_index
probe:
  models: [linear]
sweep: layer
