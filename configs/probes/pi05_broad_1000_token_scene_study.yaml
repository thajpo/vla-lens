name: PI0.5 broad 1000 token-preserving scene object study channel 64
question: Does preserving action-token positions or combining expert layers improve decoding of every scene object's identity and XYZ position?
hypothesis_family: structured whole-scene object representation
intended_claim: A matched comparison of whether object information is distributed across expert depth, localized to action-token positions, both, or neither.
feature:
  id: expert_action_hidden
  module: pi05.expert.layers.*
  tensor_type: hidden_tokens
  token_kind: action
  layers: [0, 4, 8, 12, 17]
  timesteps: all
  policy_calls: all
  generation_step: final
  dtype: float32
split:
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
probe:
  readout_dims: [64, 128]
  ridge_alphas: [1.0, 10.0]
  token_channel_dim: 64
  channel_sample_count: 50000
  projection_fit_rows: 10000
  io_workers: 8
  min_train_episodes: 5
  mixture_iterations: 5
  mixture_regularization: 0.001
  bootstrap_samples: 2000
  cache: true
