# Probe training uses saved activations in the normal repo environment, not capture wrappers.
name: PI0.5 broad 1000 current contact within lift phase - expert action hidden
question: Within lift-or-transport phase, is the robot currently contacting any object?
hypothesis_family: residual physical interaction state
intended_claim: contact state is linearly decodable within a fixed behavior phase above task, object, candidate-set, and timing baselines
target:
  name: current_contact_present
  kind: classification
  source: row
  column: current_contact_present
  missing_policy: drop
features:
  module: pi05.expert.layers.*
  tensor_type: hidden_tokens
  token_kind: action
  layers: [0, 4, 8, 12, 17]
  timesteps: all
  policy_calls: [0, 1, 2, 3, 4, 5, 6]
  generation_step: final
  reduction: mean
  dtype: float32
split:
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
  eval_values: [val_heldout_task, test_heldout_task]
row_filter:
  all:
    - column: task_phase
      op: "=="
      value: lift_or_transport
baseline:
  - majority_class
  - benchmark
  - task_id
  - prompt
  - primary_target_object
  - candidate_objects
  - visible_candidate_count
  - policy_call_index
probe:
  models: [linear]
sweep: layer
