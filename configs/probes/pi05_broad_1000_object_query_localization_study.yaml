name: PI0.5 broad 1000 explicit visual object-query localization study
question: Given an object identity, can a shared visual-token decoder find that object in the image?
hypothesis_family: object-conditioned visual localization
intended_claim: >-
  Exploratory held-out-task evidence that a query-conditioned patch decoder
  locates named objects beyond fixed spatial, query/coordinate, prompt/scene,
  wrong-query, shuffled-activation, and patch-position controls.
source_probe_artifact_id: token_scene_probe_study-pi0.5-broad-1000-initial-visual-object-query-identity-and-location-study-ed33f5bd37
