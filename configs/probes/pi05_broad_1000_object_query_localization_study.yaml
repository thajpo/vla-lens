camera_name: agentview
context_columns: [benchmark, scene_family, task_phase, prompt]
probe:
  layers: [0, 4, 8, 12, 17]
  models: [linear, mlp]
  alphas: [0.0001]
  mlp_hidden_units: 64
  max_iter: 300
  min_train_episodes: 5
  random_state: 20260830
sampling:
  max_train_examples: 400000
  max_selection_examples: 100000
