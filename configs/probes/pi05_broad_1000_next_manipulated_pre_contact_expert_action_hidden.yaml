# Probe training uses saved activations in the normal repo environment, not capture wrappers.
name: PI0.5 broad 1000 next manipulated pre-contact - expert action hidden
target:
  name: next_manipulated_object
  kind: classification
  source: row
  column: next_manipulated_object
  missing_policy: drop
features:
  module: pi05.expert.layers.*
  tensor_type: hidden_tokens
  token_kind: action
  layers: [0, 4, 8, 12, 17]
  timesteps: all
  policy_calls: [0, 1, 2, 3, 4, 5, 6]
  generation_step: final
  reduction: mean
  dtype: float32
split:
  # Held-out task split is the claim-bearing split for broad-1000 configs.
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
  eval_values: [val_heldout_task, test_heldout_task]
row_filter:
  all:
    - column: next_manipulated_object
      op: present
    - column: is_pre_contact
      op: truthy
    - column: is_pre_motion
      op: truthy
baseline:
  - majority_class
  - benchmark
  - task_id
  - prompt
  - policy_call_index
  - task_phase
probe:
  models: [linear]
sweep: layer
