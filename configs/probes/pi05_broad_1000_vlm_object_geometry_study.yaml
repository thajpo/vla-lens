name: PI0.5 broad 1000 VLM object geometry study
question: How well do PI0.5 visual and VLM-prefix representations encode the instructed object's position and orientation?
hypothesis_family: object-centered geometry in the visual-language pathway
intended_claim: Exploratory localization of object pose information before the action expert beyond task, scene, object, timing, and pose-persistence baselines.
object_column: primary_target_object
features:
  - id: image_prefix_hidden
    name: pi05.vlm.prefix.image_hidden_tokens
    tensor_type: hidden_tokens
    timesteps: all
    policy_calls: all
    reduction: mean
    dtype: float32
    sweep: []
  - id: vlm_prefix_endpoints
    module: pi05.vlm.layers.*
    tensor_type: hidden_tokens
    layers: [0, 17]
    timesteps: all
    policy_calls: all
    reduction: mean
    dtype: float32
    sweep: [layer]
split:
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
baseline:
  - benchmark
  - task_id
  - scene_family
  - primary_target_object
  - task_phase
  - policy_call_index
probe:
  pca_dims: [64, 128, 256]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
