name: PI0.5 broad 1000 action-head object geometry study
question: How well does the PI0.5 action-head input encode the instructed object's position and orientation?
hypothesis_family: object-centered geometry at the action boundary
intended_claim: Exploratory localization of object pose information at the action-head boundary beyond task, scene, object, timing, and pose-persistence baselines.
object_column: primary_target_object
features:
  - id: action_head_input
    name: pi05.action_head.input
    tensor_type: action_head
    token_kind: action
    timesteps: all
    policy_calls: all
    generation_step: final
    reduction: mean
    dtype: float32
    sweep: []
split:
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
baseline:
  - benchmark
  - task_id
  - scene_family
  - primary_target_object
  - task_phase
  - policy_call_index
probe:
  pca_dims: [64, 128, 256]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
