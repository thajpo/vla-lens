name: PI0.5 broad 1000 matched initial-scene visual localization study random ranking v2
question: When one object moves between otherwise matched initial scenes, do PI0.5 visual patch representations change at that object's old and new image regions?
hypothesis_family: object-local visual scene representation
intended_claim: A controlled, non-causal test of whether object-specific scene changes are spatially localized in captured visual patch representations.
feature:
  camera_id: main
  camera_name: agentview
  include_input_embeddings: true
  layers: [0, 4, 8, 12, 17]
matching:
  movement_threshold_m: 0.01
  stationary_threshold_m: 0.01
  robot_threshold_m: 0.01
split:
  kind: heldout_task
  column: split
  train_value: train
  selection_value: val_heldout_task
  test_value: test_heldout_task
analysis:
  io_workers: 8
  bootstrap_samples: 2000
