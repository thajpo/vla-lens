name: License decision
description: Track a maintainer/admin decision about repository licensing.
title: "[License]: Decide repository license"
labels: ["admin", "license"]
body:
  - type: markdown
    attributes:
      value: |
        This repository currently has no tracked license file. Do not add a license in routine code or hygiene work; use this issue type to make the maintainer decision explicit.
  - type: textarea
    id: intended-use
    attributes:
      label: Intended use and distribution
      description: Describe whether the repo is private research, internal tooling, public OSS, dataset tooling, or package distribution.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints to review
      description: Mention dependencies, dataset/model licenses, employer or lab policies, publication plans, and contributor expectations.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision record
      description: Leave blank until a maintainer/admin chooses a license or chooses to keep the repo unlicensed.
