name: License decision
description: Track a maintainer/admin decision about repository licensing or license changes.
title: "[License]: Review repository license"
labels: ["admin", "license"]
body:
  - type: markdown
    attributes:
      value: |
        This repository currently tracks an MIT license. Use this issue type when distribution, dependency, dataset, model, employer/lab, or contributor constraints require a license review or license change.
  - type: textarea
    id: intended-use
    attributes:
      label: Intended use and distribution
      description: Describe whether the repo is private research, internal tooling, public OSS, dataset tooling, or package distribution.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints to review
      description: Mention dependencies, dataset/model licenses, employer or lab policies, publication plans, and contributor expectations.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision record
      description: Leave blank until a maintainer/admin chooses whether to keep MIT or change the repository license.
